name: Android Build & Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pilih Mode Build (test / release)'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - release

permissions:
  contents: write

jobs:
  build:
    name: Build & Test Android Lua
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Determine Build Mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
            TAG="v5.5.1-run${{ github.run_number }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            MODE="release"
            TAG="${{ github.ref_name }}"
          else
            MODE="test"
            TAG=""
          fi
          echo "build_mode=$MODE" >> $GITHUB_OUTPUT
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          echo "BUILD_MODE=$MODE" >> $GITHUB_ENV
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "=========================================="
          echo "Triggered by: ${{ github.event_name }}"
          echo "Git Reference: ${{ github.ref }}"
          echo "Target Build Mode: $MODE"
          echo "Release Tag: $TAG"
          echo "=========================================="

      - name: Build Lua 5.5.1 for Android ABIs
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify & Test ABI Binaries
        run: |
          echo "=========================================="
          echo "Verifying compiled ABI binaries in dist/..."
          echo "=========================================="
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            SO_FILE="dist/jniLibs/$ABI/liblua.so"
            if [ ! -f "$SO_FILE" ]; then
              echo "::error::Binary $SO_FILE not found!"
              exit 1
            fi
            FILE_SIZE=$(stat -c%s "$SO_FILE")
            echo "✓ Verified $SO_FILE ($FILE_SIZE bytes)"
            readelf -h "$SO_FILE" | grep -E "Class:|Machine:" || true
          done
          echo "✓ All 4 ABI targets built and verified successfully!"

      - name: Create Distribution Archives
        run: |
          cd dist
          zip -r -y ../lua-android-5.5.1.zip jniLibs include kotlin
          tar -czvf ../lua-android-5.5.1.tar.gz jniLibs include kotlin
          cd ..

      - name: Upload Test Artifacts
        if: steps.mode.outputs.build_mode == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: lua-android-test-${{ github.sha }}
          path: |
            lua-android-5.5.1.zip
            lua-android-5.5.1.tar.gz
            dist/
          retention-days: 7

      - name: Upload Release Artifacts
        if: steps.mode.outputs.build_mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: lua-android-release-${{ github.ref_name }}
          path: |
            lua-android-5.5.1.zip
            lua-android-5.5.1.tar.gz
          retention-days: 90

      - name: Publish GitHub Release
        if: steps.mode.outputs.build_mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.mode.outputs.release_tag }}
          tag_name: ${{ steps.mode.outputs.release_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            lua-android-5.5.1.zip
            lua-android-5.5.1.tar.gz
